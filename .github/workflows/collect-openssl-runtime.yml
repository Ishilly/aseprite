name: Collect Aseprite Windows Runtime

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect-runtime:
    runs-on: windows-latest
    steps:
      - name: Collect OpenSSL runtime DLLs
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path runtime | Out-Null
          $openSslBin = 'C:\Program Files\OpenSSL\bin'
          $dlls = @('libcrypto-3-x64.dll', 'libssl-3-x64.dll')
          foreach ($dll in $dlls) {
            $source = Join-Path $openSslBin $dll
            if (Test-Path -LiteralPath $source) {
              Copy-Item -LiteralPath $source -Destination runtime
            }
          }
          if (-not (Test-Path -LiteralPath 'runtime\libcrypto-3-x64.dll')) {
            throw 'Required OpenSSL runtime DLL was not found'
          }

      - name: Upload runtime DLLs
        uses: actions/upload-artifact@v4
        with:
          name: aseprite-openssl-runtime
          path: runtime/
          if-no-files-found: error
          retention-days: 1
